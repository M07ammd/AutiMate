<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Recommendations — Autimate</title>
  <style>
    :root {
      --bg:        #0d0d1a;
      --bg2:       #13132a;
      --bg3:       #1a1a35;
      --purple:    #7c4dff;
      --purple2:   #9c6fff;
      --text:      #e8e8f0;
      --subtext:   #8888aa;
      --border:    rgba(124,77,255,0.25);
      --radius:    18px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo-ring {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid var(--purple);
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle, #3b1f8a, #1a0a4a);
      font-size: 24px;
    }

    .header-title h1 {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
    }

    .header-title p {
      font-size: 12px;
      color: var(--purple2);
      margin-top: 4px;
    }

    .back-btn {
      background: var(--bg2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .back-btn:hover {
      background: var(--purple);
      border-color: var(--purple);
    }

    /* ── INTENT SECTION ── */
    .intent-section {
      margin-bottom: 50px;
    }

    .intent-header {
      margin-bottom: 30px;
    }

    .intent-title {
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--purple2), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .intent-subtitle {
      font-size: 14px;
      color: var(--subtext);
    }

    /* ── CARDS GRID ── */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: linear-gradient(135deg, var(--bg3), var(--bg2));
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(124, 77, 255, 0.1), transparent);
      transition: left 0.5s;
    }

    .card:hover::before {
      left: 100%;
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: var(--purple);
      background: linear-gradient(135deg, var(--bg2), #252550);
      box-shadow: 0 8px 32px rgba(124, 77, 255, 0.2);
    }

    .card-top-bar {
      height: 4px;
      background: linear-gradient(90deg, var(--purple), var(--purple2));
      border-radius: 2px;
      margin-bottom: 16px;
    }

    .card-icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: inline-block;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(124, 77, 255, 0.1);
      border-radius: 12px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 10px;
      word-break: break-word;
    }

    .card-category {
      display: inline-block;
      font-size: 11px;
      background: rgba(124, 77, 255, 0.25);
      color: var(--purple2);
      padding: 4px 12px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .card-description {
      font-size: 14px;
      color: var(--subtext);
      line-height: 1.6;
      margin-bottom: 16px;
      flex: 1;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(124, 77, 255, 0.15);
      padding-top: 12px;
    }

    .card-duration {
      font-size: 12px;
      color: var(--subtext);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-btn {
      background: var(--purple);
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .card-btn:hover {
      background: var(--purple2);
      transform: scale(1.05);
    }

    /* ── EMPTY STATE ── */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .empty-state h2 {
      font-size: 24px;
      margin-bottom: 10px;
      color: #fff;
    }

    .empty-state p {
      font-size: 14px;
      color: var(--subtext);
      margin-bottom: 30px;
    }

    /* ── LOADING ── */
    .loading {
      text-align: center;
      padding: 60px 20px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(124, 77, 255, 0.3);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading p {
      color: var(--subtext);
      font-size: 14px;
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 768px) {
      .header {
        flex-direction: column;
        gap: 20px;
        align-items: flex-start;
      }

      .intent-title {
        font-size: 24px;
      }

      .cards-grid {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .card {
        padding: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- HEADER -->
    <div class="header">
      <div class="header-left">
        <div class="logo-ring">🧩</div>
        <div class="header-title">
          <h1>AUTIMATE AI</h1>
          <p>Personalized Recommendations</p>
        </div>
      </div>
      <button class="back-btn" onclick="goBack()">
        ← Back to Chat
      </button>
    </div>

    <!-- MAIN CONTENT -->
    <div id="content">
      <!-- Will be populated by JavaScript -->
    </div>
  </div>

  <script>
    const iconMap = {
      code: "💻",
      fitness: "🏃",
      book: "📚",
      school: "🎓",
      music: "🎵",
      psychology: "🧠",
      sports: "⚽",
      self_improvement: "📈",
      learning: "🎯",
      health: "❤️",
      hobby: "🎨",
      wellness: "🌿",
      productivity: "⚡",
      skill: "🔧",
    };

    function goBack() {
      window.history.back();
    }

    function renderRecommendations(intent, cards) {
      const content = document.getElementById("content");
      
      if (!cards || cards.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">🤔</div>
            <h2>No Recommendations Found</h2>
            <p>Try asking something different</p>
            <button class="back-btn" onclick="goBack()">← Back to Chat</button>
          </div>
        `;
        return;
      }

      let html = `
        <div class="intent-section">
          <div class="intent-header">
            <div class="intent-title">${intent.replace(/_/g, " ").toUpperCase()}</div>
            <div class="intent-subtitle">Here are personalized suggestions for you</div>
          </div>
          <div class="cards-grid">
      `;

      cards.forEach((card, index) => {
        const icon = iconMap[card.icon] || "⭐";
        html += `
          <div class="card" style="animation: slideUp 0.6s ease-out ${index * 0.1}s both;">
            <div class="card-top-bar"></div>
            <div class="card-icon">${icon}</div>
            <div class="card-title">${card.title}</div>
            <div class="card-category">${card.category}</div>
            <div class="card-description">${card.description}</div>
            <div class="card-footer">
              <div class="card-duration">⏱️ ${card.duration}</div>
              <button class="card-btn" onclick="selectCard('${card.title.replace(/'/g, "\\'")}')">
                Start
              </button>
            </div>
          </div>
        `;
      });

      html += `
          </div>
        </div>
      `;

      content.innerHTML = html;

      // Add animation
      const style = document.createElement('style');
      style.textContent = `
        @keyframes slideUp {
          from {
            opacity: 0;
            transform: translateY(30px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      `;
      document.head.appendChild(style);
    }

    function selectCard(title) {
      // Store selected card and return to chat
      localStorage.setItem('selectedCard', title);
      window.location.href = '/';
    }

    // Load recommendations from localStorage
    window.addEventListener('load', () => {
      const data = localStorage.getItem('recommendations');
      
      if (data) {
        const rec = JSON.parse(data);
        renderRecommendations(rec.intent, rec.cards);
      } else {
        document.getElementById("content").innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📭</div>
            <h2>No Recommendations Yet</h2>
            <p>Ask for recommendations in the chat</p>
            <button class="back-btn" onclick="goBack()">← Back to Chat</button>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
